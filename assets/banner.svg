<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#243b55" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>

    <!-- CSS Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.03); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.1); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes blinkNode {
        0%, 100% { fill-opacity: 0.5; r: 4; }
        50% { fill-opacity: 1; r: 6; }
      }
      .floating-orb1 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .floating-orb2 {
        animation: pulseGlow 9s ease-in-out infinite alternate;
        transform-origin: 1000px 300px;
      }
      .animated-data-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 20s linear infinite;
      }
      .animated-data-line-reverse {
        stroke-dasharray: 6 10;
        animation: dashFlow 15s linear infinite reverse;
      }
      .blinking-node {
        animation: blinkNode 3s ease-in-out infinite;
      }
      .blinking-node-delay {
        animation: blinkNode 3.5s ease-in-out infinite 1.5s;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="floating-orb1" cx="220" cy="120" r="180" fill="url(#orbGlow1)" />
  <circle class="floating-orb2" cx="980" cy="300" r="220" fill="url(#orbGlow2)" />

  <!-- Animated Architecture / Snapshot Graph Lines (Background Layer) -->
  <g opacity="0.45">
    <path class="animated-data-line" d="M 80,340 C 260,260 380,380 580,320 C 780,260 920,360 1120,310" fill="none" stroke="#00f2fe" stroke-width="1.8" />
    <path class="animated-data-line-reverse" d="M 80,380 C 280,330 420,390 640,350 C 860,310 980,380 1120,340" fill="none" stroke="#9d4edd" stroke-width="1.5" />
    
    <!-- Snapshot Tree / Block Representation (Abstract) -->
    <line x1="880" y1="90" x2="1080" y2="90" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="940" y1="90" x2="940" y2="150" stroke="#00f2fe" stroke-width="1.5" />
    <line x1="1020" y1="90" x2="1020" y2="150" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="880" cy="90" class="blinking-node" fill="#00f2fe" />
    <circle cx="940" cy="90" r="4" fill="#00f2fe" />
    <circle cx="1020" cy="90" r="4" fill="#00f2fe" />
    <circle cx="1080" cy="90" class="blinking-node-delay" fill="#00f2fe" />
    
    <rect x="915" y="150" width="50" height="24" rx="4" fill="#1c2541" stroke="#00f2fe" stroke-width="1.2" />
    <text x="940" y="166" fill="#00f2fe" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">SNAP-01</text>
    
    <rect x="995" y="150" width="50" height="24" rx="4" fill="#1c2541" stroke="#9d4edd" stroke-width="1.2" />
    <text x="1020" y="166" fill="#c77dff" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">SNAP-02</text>
  </g>

  <!-- Foreground Foreground Container for Guaranteed Contrast & Readability -->
  <g transform="translate(80, 0)">
    <!-- Category Badge / Pill -->
    <g transform="translate(0, 68)">
      <rect width="280" height="30" rx="15" fill="#1c2541" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="5" fill="#00f2fe" />
      <text x="30" y="20" fill="#e0f7fa" font-size="12" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" letter-spacing="0.8">
        ENTERPRISE &amp; CLOUD STORAGE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" fill="#ffffff" font-size="44" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" letter-spacing="-0.5">
      Cloud Storage Snapshot Management
    </text>

    <!-- Accent Gradient Separator Line -->
    <rect x="0" y="172" width="720" height="3.5" rx="2" fill="url(#accentLine)" />

    <!-- Subtitle / Tagline -->
    <text x="0" y="210" fill="#cbd5e1" font-size="20" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
      Curated Ecosystem of SaaS Platforms &amp; Open-Source Snapshot Solutions
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 245)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="8" fill="#131e3a" stroke="#334155" stroke-width="1" />
        <text x="90" y="23" fill="#38bdf8" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">
          ⚡ Point-in-Time Copies
        </text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="195" height="36" rx="8" fill="#131e3a" stroke="#334155" stroke-width="1" />
        <text x="97" y="23" fill="#818cf8" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">
          🔄 Policy Orchestration
        </text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(405, 0)">
        <rect width="185" height="36" rx="8" fill="#131e3a" stroke="#334155" stroke-width="1" />
        <text x="92" y="23" fill="#a78bfa" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">
          🛡️ Ransomware Immutability
        </text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(605, 0)">
        <rect width="165" height="36" rx="8" fill="#131e3a" stroke="#334155" stroke-width="1" />
        <text x="82" y="23" fill="#34d399" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">
          🚀 Instant Disaster Recovery
        </text>
      </g>
    </g>

    <!-- Sub-text / Stats Bar -->
    <text x="0" y="325" fill="#94a3b8" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
      Block Storage • Kubernetes CSI Snapshots • Cloud Hyperscalers • Air-Gapped Vaults • Deduplication
    </text>
  </g>

  <!-- Border Frame Glow -->
  <rect x="0" y="0" width="1200" height="420" rx="16" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.25" />
</svg>
